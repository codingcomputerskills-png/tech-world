const information={
virus:{title:'Համակարգչային վիրուսներ',text:`<p>Համակարգչային վիրուսները վնասակար ծրագրեր են, որոնք կարող են ներթափանցել համակարգիչ և խանգարել դրա բնականոն աշխատանքին։</p><h3>Վիրուսների տեսակները</h3><p><b>1. Trojan (Տրոյական ծրագիր)</b> – ծրագիր, որը ներկայանում է որպես օգտակար, բայց կարող է վնասել համակարգիչը։</p><p><b>2. Worm (Որդ)</b> – վնասակար ծրագիր, որը կարող է ինքնուրույն տարածվել համակարգչային ցանցերով։</p><p><b>3. Ransomware</b> – ծրագիր, որը սահմանափակում է ֆայլերի հասանելիությունը և պահանջում գումար։</p><h3>Ինչպե՞ս պաշտպանվել</h3><p>Օգտագործել հակավիրուսային ծրագիր, չբացել անհայտ հղումներ և ներբեռնումներ, պարբերաբար թարմացնել համակարգիչը։</p><h3>Հետաքրքիր փաստ</h3><p>Առաջին համակարգչային վիրուսներից մեկը՝ Creeper-ը, ստեղծվել է 1971 թվականին։</p>`},

hacker:{title:'Հաքերներ',text:`<p>Հաքերները մարդիկ են, որոնք ունեն համակարգչային համակարգերի և ցանցերի մասին խոր գիտելիքներ։ Նրանք ուսումնասիրում են համակարգերի աշխատանքը և դրանց անվտանգության թույլ կողմերը։</p><h3>Հաքերների տեսակները</h3><p><b>White Hat</b> – աշխատում են համակարգերի անվտանգությունը բարելավելու համար։</p><p><b>Black Hat</b> – օգտագործում են իրենց գիտելիքները ապօրինի նպատակներով։</p><p><b>Grey Hat</b> – գործում են այս երկու խմբերի միջև, երբեմն առանց թույլտվության ուսումնասիրելով համակարգերը։</p><h3>Ինչո՞վ են զբաղվում</h3><p>Ուսումնասիրում են ծրագրերը, հայտնաբերում անվտանգության խնդիրները և օգնում կազմակերպություններին պաշտպանել տվյալները։</p><h3>Հետաքրքիր փաստ</h3><p>Կիբերանվտանգության մասնագետները կարող են աշխատել բանկերում, պետական կառույցներում և տեխնոլոգիական ընկերություններում։</p>`},

attack:{title:'Կիբերհարձակումներ',text:`<p>Կիբերհարձակումները թվային համակարգերի, կայքերի կամ տվյալների դեմ իրականացվող վնասակար գործողություններ են։ Դրանց նպատակ կարող է լինել տեղեկատվության գողությունը կամ համակարգի աշխատանքի խափանումը։</p><h3>Հիմնական տեսակները</h3><p><b>Ֆիշինգ</b> – կեղծ հաղորդագրությունների միջոցով անձնական տվյալներ ստանալու փորձ։</p><p><b>DDoS հարձակում</b> – մեծ քանակությամբ հարցումներով կայքի աշխատանքը խափանելու փորձ։</p><p><b>Տվյալների գողություն</b> – անձնական կամ կազմակերպության տեղեկությունների ապօրինի ձեռքբերում։</p><h3>Ինչպե՞ս խուսափել</h3><p>Ստուգել կայքերի հասցեները, չվստահել կասկածելի նամակներին և երբեք չտրամադրել գաղտնաբառերը անծանոթներին։</p><h3>Հետաքրքիր փաստ</h3><p>Կիբերհարձակումները կարող են թիրախավորել ոչ միայն համակարգիչները, այլև հեռախոսները և խելացի սարքերը։</p>`},

protection:{title:'Պաշտպանության կանոններ',text:`<p>Համացանցում անվտանգ լինելը կարևոր է յուրաքանչյուր մարդու համար։ Անձնական տվյալների պաշտպանությունը օգնում է խուսափել բազմաթիվ խնդիրներից։</p><h3>Անվտանգության 7 կանոն</h3><p>1. Մի բացիր անհայտ հղումներ։</p><p>2. Մի ներբեռնիր կասկածելի ֆայլեր։</p><p>3. Օգտագործիր հակավիրուսային ծրագիր։</p><p>4. Թարմացրու համակարգչի ծրագրերը։</p><p>5. Մի հրապարակիր անձնական տվյալներ։</p><p>6. Օգտագործիր երկքայլ հաստատում։</p><p>7. Պարբերաբար պահուստավորիր կարևոր ֆայլերը։</p><h3>Ինչո՞ւ է սա կարևոր</h3><p>Այս կանոնները նվազեցնում են տվյալների կորստի, խաբեության և համակարգչի վնասման վտանգը։</p>`},

password:{title:'Գաղտնաբառերի անվտանգություն',text:`<p>Գաղտնաբառը պաշտպանում է մեր անձնական հաշիվները և տվյալները։ Այն պետք է լինի դժվար կռահելի և տարբեր յուրաքանչյուր հաշվի համար։</p><h3>Ուժեղ գաղտնաբառի հատկանիշները</h3><p>• Պարունակում է առնվազն 12 նիշ։</p><p>• Ներառում է մեծատառեր և փոքրատառեր։</p><p>• Պարունակում է թվեր և հատուկ նշաններ։</p><p>• Չի պարունակում անուն կամ ծննդյան ամսաթիվ։</p><h3>Երկքայլ հաստատում</h3><p>Սա անվտանգության լրացուցիչ միջոց է, որի դեպքում գաղտնաբառից բացի անհրաժեշտ է նաև երկրորդ հաստատում։</p><h3>Հիշի՛ր</h3><p>Երբեք մի փոխանցիր քո գաղտնաբառը ուրիշներին։</p>`},

whatAI:{title:'Ի՞նչ է արհեստական բանականությունը',text:`<p>Արհեստական բանականությունը (ԱԲ) տեխնոլոգիա է, որը հնարավորություն է տալիս համակարգիչներին կատարել այնպիսի առաջադրանքներ, որոնք սովորաբար պահանջում են մարդկային մտածողություն։</p><h3>Ի՞նչ կարող է անել ԱԲ-ն</h3><p>• Ճանաչել պատկերներ և ձայներ։</p><p>• Պատասխանել հարցերին։</p><p>• Թարգմանել տեքստեր։</p><p>• Ստեղծել նկարներ և երաժշտություն։</p><p>• Վերլուծել մեծ քանակությամբ տվյալներ։</p><h3>Ինչպե՞ս է աշխատում</h3><p>ԱԲ համակարգերը սովորում են մեծ քանակությամբ տվյալներից և դրանց հիման վրա փորձում են գտնել օրինաչափություններ ու ստեղծել պատասխաններ։</p><h3>Օրինակներ</h3><p>ChatGPT, Google Gemini, Microsoft Copilot և այլ գործիքներ։</p>`},

chatgpt:{title:'ChatGPT',text:`<p>ChatGPT-ն OpenAI ընկերության ստեղծած արհեստական բանականության համակարգ է, որը կարող է հասկանալ և ստեղծել տեքստային պատասխաններ։</p><h3>Ի՞նչ կարող է անել ChatGPT-ն</h3><p>• Պատասխանել տարբեր հարցերի։</p><p>• Օգնել սովորել և հասկանալ դասերը։</p><p>• Թարգմանել տեքստեր։</p><p>• Գրել և բացատրել ծրագրավորման կոդեր։</p><p>• Օգնել ստեղծագործական աշխատանքներում։</p><h3>Առավելությունները</h3><p>Արագ աշխատանք, տարբեր թեմաներով օգնություն և տեղեկությունների պարզ բացատրություն։</p><h3>Թերությունները</h3><p>Երբեմն կարող է սխալ տեղեկություն տալ, ուստի կարևոր փաստերը պետք է ստուգել վստահելի աղբյուրներով։</p>`},

tools:{title:'ԱԲ գործիքներ',text:`<p>Այսօր գոյություն ունեն բազմաթիվ արհեստական բանականության գործիքներ, որոնք օգնում են մարդկանց սովորել, ստեղծագործել և աշխատել։</p><h3>Հայտնի գործիքներ</h3><p><b>ChatGPT</b> – հարցերի պատասխաններ, տեքստեր և ուսումնական օգնություն։</p><p><b>Google Gemini</b> – հարցերի պատասխաններ և տարբեր առաջադրանքների կատարում։</p><p><b>Microsoft Copilot</b> – օգնում է տեղեկատվության որոնման և աշխատանքի ընթացքում։</p><p><b>Canva AI</b> – օգնում է ստեղծել դիզայններ և պատկերներ։</p><p><b>Adobe Firefly</b> – պատկերների և դիզայնի ստեղծման գործիք։</p><h3>Ինչո՞ւ են դրանք օգտակար</h3><p>Դրանք խնայում են ժամանակը, հեշտացնում աշխատանքը և բացում նոր ստեղծագործական հնարավորություններ։</p>`},

uses:{title:'ԱԲ-ի կիրառությունները',text:`<p>Արհեստական բանականությունն արդեն օգտագործվում է կյանքի բազմաթիվ ոլորտներում։</p><h3>Կրթություն</h3><p>Օգնում է աշակերտներին հասկանալ բարդ թեմաները, սովորել լեզուներ և ստուգել գիտելիքները։</p><h3>Բժշկություն</h3><p>Օգնում է բժիշկներին ուսումնասիրել բժշկական պատկերները և վերլուծել տվյալները։</p><h3>Տրանսպորտ</h3><p>Օգտագործվում է երթևեկության կառավարման և ինքնավար մեքենաների զարգացման մեջ։</p><h3>Գիտություն</h3><p>Օգնում է գիտնականներին ուսումնասիրել տվյալներ և արագացնել հետազոտությունները։</p><h3>Արվեստ</h3><p>Օգնում է ստեղծել նկարներ, երաժշտություն և տեսանյութեր։</p>`},

future:{title:'Արհեստական բանականության ապագան',text:`<p>Արհեստական բանականությունը արագ զարգացող տեխնոլոգիա է, որը կարող է մեծ փոփոխություններ բերել ապագայում։</p><h3>Ի՞նչ փոփոխություններ կարող են լինել</h3><p>• Ավելի խելացի համակարգեր։</p><p>• Բժշկության նոր հնարավորություններ։</p><p>• Կրթության անհատականացում։</p><p>• Աշխատանքի նոր մասնագիտություններ։</p><p>• Ավելի զարգացած ռոբոտներ։</p><h3>Կարո՞ղ է ԱԲ-ն փոխարինել մարդուն</h3><p>ԱԲ-ն կարող է ավտոմատացնել որոշ աշխատանքներ, սակայն մարդկային ստեղծագործականությունը, պատասխանատվությունը և քննադատական մտածողությունը շարունակում են կարևոր դեր ունենալ։</p><h3>Եզրակացություն</h3><p>Արհեստական բանականությունը կարող է դառնալ մեր ապագայի կարևորագույն տեխնոլոգիաներից մեկը։ Կարևոր է այն օգտագործել խելամիտ և պատասխանատու ձևով։</p>`},

cpp:{title:'C++ ծրագրավորման լեզու',text:`<p>C++-ը ծրագրավորման լեզու է, որն օգտագործվում է արագ և արդյունավետ ծրագրեր ստեղծելու համար։ Այն ստեղծվել է Բյարնե Ստրաուստրուպի կողմից և զարգացել է C լեզվի հիման վրա։</p><h3>Որտե՞ղ է կիրառվում</h3><p>• Համակարգչային ծրագրերում։</p><p>• Խաղերի ստեղծման մեջ։</p><p>• Օպերացիոն համակարգերի որոշ մասերում։</p><p>• Ռոբոտաշինության և ներկառուցված համակարգերում։</p><h3>Առանձնահատկություն</h3><p>C++-ը թույլ է տալիս կառավարել համակարգչի ռեսուրսները և ստեղծել բարձր արագությամբ աշխատող ծրագրեր։</p>`},

python:{title:'Python ծրագրավորման լեզու',text:`<p>Python-ը բարձր մակարդակի ծրագրավորման լեզու է, որը հայտնի է իր պարզ և ընթեռնելի շարահյուսությամբ։ Այն հարմար է ինչպես սկսնակների, այնպես էլ փորձառու ծրագրավորողների համար։</p><h3>Որտե՞ղ է կիրառվում</h3><p>• Արհեստական բանականության մեջ։</p><p>• Տվյալների վերլուծության համար։</p><p>• Կայքերի և հավելվածների ստեղծման մեջ։</p><p>• Գործընթացների ավտոմատացման համար։</p><h3>Առանձնահատկություն</h3><p>Python-ի կոդը սովորաբար հեշտ է կարդալ և հասկանալ, այդ պատճառով այն հաճախ խորհուրդ է տրվում ծրագրավորում սովորել սկսողներին։</p>`},

javascript:{title:'JavaScript ծրագրավորման լեզու',text:`<p>JavaScript-ը ծրագրավորման լեզու է, որն առավել հաճախ օգտագործվում է կայքերին շարժունություն և ինտերակտիվություն հաղորդելու համար։</p><h3>Որտե՞ղ է կիրառվում</h3><p>• Կայքերի ինտերակտիվ տարրերում։</p><p>• Վեբ հավելվածներում։</p><p>• Սերվերային ծրագրերում։</p><p>• Բջջային և համակարգչային որոշ հավելվածներում։</p><h3>Առանձնահատկություն</h3><p>JavaScript-ը հիմնական լեզուներից է, որն օգտագործվում է ժամանակակից վեբ ծրագրավորման մեջ։</p>`},

};// Տվյալների բազա՝ IndexedDB
const DB_NAME='TECH_WORLD_DATABASE';
const DB_VERSION=1;

const SITE_BASE='https://codingcomputerskills-png.github.io/tech-world/images/';

function openDB(){
return new Promise((resolve,reject)=>{
const request=indexedDB.open(DB_NAME,DB_VERSION);
request.onupgradeneeded=function(){
const db=request.result;
if(!db.objectStoreNames.contains('problems'))
db.createObjectStore('problems',{keyPath:'id'});
if(!db.objectStoreNames.contains('pictures'))
db.createObjectStore('pictures',{keyPath:'id'});
};
request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
}

async function getAllDB(store){
const db=await openDB();
return new Promise((resolve,reject)=>{
const request=db.transaction(store).objectStore(store).getAll();
request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);
});
}

async function saveDB(store,item){
const db=await openDB();
return new Promise((resolve,reject)=>{
const tx=db.transaction(store,'readwrite');
tx.objectStore(store).put(item);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);
});
}

async function deleteDB(store,id){
const db=await openDB();
return new Promise((resolve,reject)=>{
const tx=db.transaction(store,'readwrite');
tx.objectStore(store).delete(id);
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);
});
}

async function prepareData(){
const problems=await getAllDB('problems');
const pictures=await getAllDB('pictures');

if(problems.length===0){
for(const p of initialProblems){
await saveDB('problems',p);
}
}

for(const initial of initialPictures){
const existing=pictures.find(p=>p.id===initial.id);

if(!existing){
await saveDB('pictures',initial);
}else{
const oldImages=(existing.images||[]).filter(src=>{
if(typeof src!=='string')return false;
if(src.startsWith('data:image/'))return true;
if(/^https?:\/\//i.test(src)){
return !/^https:\/\/codingcomputerskills-png\.github\.io\/tech-world\/(images\/)?nkar[1-8]\.jpg$/i.test(src);
}
return false;
});

existing.images=[...initial.images,...oldImages];
await saveDB('pictures',existing);
}
}
}

async function openProblems(){
document.getElementById('projectArea').innerHTML=`
<div class="project-panel">
<h3>📝 Խնդիրներ</h3>
<p>Ընտրիր խնդիրը կամ ավելացրու նորը։</p>
<div class="project-list" id="problemList"></div>
<button class="add-btn" onclick="addProblem()">+ Ավելացնել խնդիր</button>
<div id="problemEditor"></div>
</div>`;
await renderProblems();
}

async function renderProblems(){
const list=document.getElementById('problemList');
if(!list)return;
const problems=await getAllDB('problems');
list.innerHTML='';
problems.sort((a,b)=>a.id-b.id).forEach(p=>{
const b=document.createElement('button');
b.textContent=p.title;
b.onclick=()=>editProblem(p.id);
list.appendChild(b);
});
}

async function editProblem(id){
const problems=await getAllDB('problems');
const p=problems.find(x=>x.id===id);
if(!p)return;

document.getElementById('problemEditor').innerHTML=`
<div class="project-editor">
<h3>${p.title}</h3>
<label>Խնդրի պայմանը</label>
<textarea id="problemText"></textarea>
<label>Արհեստական բանականության լուծումը</label>
<textarea id="problemAI"></textarea>
<label>Աշակերտների լուծումը</label>
<textarea id="problemStudents"></textarea>
<div class="project-tools">
<button onclick="saveProblem(${id})">💾 Պահպանել</button>
<button onclick="deleteProblem(${id})">🗑️ Ջնջել</button>
</div>
<p id="problemMessage" class="save-message"></p>
</div>`;

document.getElementById('problemText').value=p.text||'';
document.getElementById('problemAI').value=p.ai||'';
document.getElementById('problemStudents').value=p.students||'';
}

async function addProblem(){
const problems=await getAllDB('problems');
const id=Math.max(0,...problems.map(p=>p.id))+1;
const p={id,title:'Խնդիր '+id,text:'',ai:'',students:''};
await saveDB('problems',p);
await renderProblems();
await editProblem(id);
}

async function saveProblem(id){
const problems=await getAllDB('problems');
const p=problems.find(x=>x.id===id);
if(!p)return;

p.text=document.getElementById('problemText').value;
p.ai=document.getElementById('problemAI').value;
p.students=document.getElementById('problemStudents').value;

await saveDB('problems',p);
document.getElementById('problemMessage').textContent='Պահպանված է։';
await renderProblems();
}

async function deleteProblem(id){
if(!confirm('Ջնջե՞լ այս խնդիրը։'))return;
await deleteDB('problems',id);
document.getElementById('problemEditor').innerHTML='';
await renderProblems();
}// ՆԿԱՐՆԵՐ

async function editPicture(id){
const pictures=await getAllDB('pictures');
const p=pictures.find(x=>x.id===id);
if(!p)return;

if(!Array.isArray(p.images))p.images=[];

document.getElementById('pictureEditor').innerHTML=`
<div class="project-editor">
<h3>${p.title}</h3>
<label>Բաժնի անունը</label>
<input id="pictureTitle" type="text">
<label>Ընտրել երկու նկար կամ ավելին</label>
<input id="pictureFile" type="file" accept="image/*" multiple>
<div id="picturePreview" class="image-preview"></div>
<div class="project-tools">
<button onclick="savePicture(${id})">💾 Պահպանել</button>
<button onclick="deletePicture(${id})">🗑️ Ջնջել բաժինը</button>
</div>
<p id="pictureMessage" class="save-message"></p>
</div>`;

const titleInput=document.getElementById('pictureTitle');
titleInput.value=p.title;
titleInput.dataset.id=id;

showPicturePreview(p.images);

document.getElementById('pictureFile').addEventListener('change',async function(){
const files=Array.from(this.files);

for(const file of files){
if(!file.type.startsWith('image/'))continue;

const data=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(reader.error);
reader.readAsDataURL(file);
});

p.images.push(data);
}

await saveDB('pictures',p);
showPicturePreview(p.images);
document.getElementById('pictureMessage').textContent='Նկարները պահպանված են։';
this.value='';
});
}

function showPicturePreview(images){
const box=document.getElementById('picturePreview');
if(!box)return;

box.innerHTML='';

if(!images||images.length===0){
box.innerHTML='<p>Նկար դեռ ավելացված չէ։</p>';
return;
}

images.forEach((image,index)=>{
const card=document.createElement('div');
card.className='image-card';

const img=document.createElement('img');
img.src=image;
img.className='project-image';
img.alt='Նկար '+(index+1);
img.style.cursor='pointer';

img.onclick=()=>{
window.open(image,'_blank');
};

img.onerror=()=>{
img.alt='Նկարը չի գտնվել։ Ստուգիր GitHub-ում ֆայլի անունը։';
img.style.minHeight='100px';
};

const remove=document.createElement('button');
remove.textContent='Ջնջել այս նկարը';
remove.onclick=()=>removePictureImage(index);

card.appendChild(img);
card.appendChild(remove);
box.appendChild(card);
});
}

async function removePictureImage(index){
const id=Number(document.getElementById('pictureTitle').dataset.id);
const pictures=await getAllDB('pictures');
const p=pictures.find(x=>x.id===id);
if(!p)return;

p.images.splice(index,1);
await saveDB('pictures',p);
showPicturePreview(p.images);
}

async function savePicture(id){
const pictures=await getAllDB('pictures');
const p=pictures.find(x=>x.id===id);
if(!p)return;

p.title=document.getElementById('pictureTitle').value.trim()||'Նկար';
await saveDB('pictures',p);

document.getElementById('pictureMessage').textContent='Պահպանված է։';
await renderPictures();
}

async function addPicture(){
const pictures=await getAllDB('pictures');
const id=Math.max(0,...pictures.map(p=>p.id))+1;

const p={
id,
title:'Նկար '+id,
images:[]
};

await saveDB('pictures',p);
await renderPictures();
await editPicture(id);
}

async function deletePicture(id){
if(!confirm('Ջնջե՞լ այս բաժինը։'))return;

await deleteDB('pictures',id);
document.getElementById('pictureEditor').innerHTML='';
await renderPictures();
}

function backToMenu(){
document.getElementById('content').style.display='none';
window.scrollTo({top:300,behavior:'smooth'});
}

prepareData().catch(error=>console.error('Տվյալների բազայի սխալ:',error));

</script>
